<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%236d4aed%27/%3E%3Cpath d=%27M16 6l2 6 6 2-6 2-2 6-2-6-6-2 6-2z%27 fill=%27white%27/%3E%3C/svg%3E" />
  <title>Sign in - BrandCraft AI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
        </div>
        <span>BrandCraft AI</span>
      </div>
      <h1 id="authTitle">Welcome back</h1>
      <p class="subtitle" id="authSubtitle">Sign in to build your brand identity.</p>

      <div id="googleWrap">
        <div id="googleBtn" style="display:flex;justify-content:center"></div>
        <button class="btn secondary google-btn hidden" id="googleFallback" type="button">Continue with Google</button>
        <div class="divider">or use email</div>
      </div>

      <form id="authForm" novalidate>
        <div class="field hidden" id="nameField">
          <label for="name">Full name</label>
          <input type="text" id="name" autocomplete="name" placeholder="Your name" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="At least 6 characters" />
        </div>
        <div class="error hidden" id="authError"></div>
        <button class="btn full" id="submitBtn" type="submit">Sign in</button>
      </form>

      <div class="switch">
        <span id="switchText">New to BrandCraft?</span>
        <button type="button" id="switchBtn">Create account</button>
      </div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
